<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7d84b2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="失眠藥廣播劇之六度圈與Game" />
    <meta property="og:description" content="為各個廣播劇角色於大千世界找出他們的六度圈連結" />
    <meta property="og:image" content="https://github.com/kikiwoo702/mcu-6degrees-game/blob/main/6degrees-game.png?raw=true" />
    <meta property="og:url" content="https://mcu-6degrees-game.vercel.app/" />
    <title>失眠藥廣播劇之六度圈與Game</title>
    <style>
        :root {
            --primary-purple: #7986cb;   /* 主色調藍紫 */
            --light-purple: #9fa8da;     /* 邊框與淡色文字 */
            --card-bg: #ffffff;          /* 純白質感卡片背景 */
            --text-dark: #333333;        /* 內文深色字 */
            --text-light: #ffffff;       /* 白色文字 */
            --success-color: #2ecc71;
            --warning-color: #f59e0b;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #7487c5;
            background-image: linear-gradient(rgba(26, 28, 36, 0.3), rgba(26, 28, 36, 0.2)), url('https://github.com/tldrkiki/mcu-6degrees-game/blob/main/6degrees-game-background.PNG?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden; 
            box-sizing: border-box;
        }

        .app-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: calc(10px + env(safe-area-inset-top)) 15px calc(10px + env(safe-area-inset-bottom)) 15px;
            box-sizing: border-box;
        }

        /* ==========================================
           【首頁樣式】
           ========================================== */
        .cover-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--text-light);
            box-sizing: border-box;
            padding: 40px 10px;
        }

        .cover-header {
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 2px;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .cover-main {
            text-align: center;
            margin-top: -40px;
        }

        .cover-title {
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .cover-subtitle {
            font-size: 1.05rem;
            opacity: 0.9;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .btn-start-game {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: var(--text-light);
            border-radius: 50px;
            padding: 16px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-start-game:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-start-game .arrow {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .btn-start-game:hover .arrow {
            transform: translateX(5px);
        }

        /* ==========================================
           【遊戲頁面樣式】
           ========================================== */
        .game-container {
            display: none; 
            width: 100%;
            max-width: 480px;
            height: 100%;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 0度起點標題：配合主調的優雅白色文字，置於方格正上方外側 */
        .game-outer-label-top {
            text-align: center;
            color: grey;
            font-size: 0.6rem;
            font-weight: bold;
            margin-bottom: 0px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* 2.png 的上半圓大白卡片 */
        .game-main-card {
            background: var(--card-bg);
            border-radius: 40px 40px 40px 40px; 
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 10px 20px;
            box-sizing: border-box;
            overflow: hidden; 
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
            position: relative; /* 供右下角懸浮按鈕做絕對定位 */
        }

        /* 關係鎖鏈垂直鏈接區 */
        .vertical-path-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .node-box {
            width: 190px;
            background-color: var(--primary-purple);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 3px 8px rgba(121, 134, 203, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid transparent;
            word-break: break-all;
        }

        .node-box:hover {
            transform: scale(1.03);
        }

        /* 起點與終點節點在鏈結中的特別樣式 */
        .node-box.start-node {
            background-color: #6573c3;
        }
        .node-box.end-node {
            background-color: #e57373;
            box-shadow: 0 3px 8px rgba(229, 115, 115, 0.3);
        }

        /* 尚未解鎖的空方格 */
        .node-box.empty {
            background-color: transparent;
            border: 2px solid #cbd5e1;
            color: #94a3b8;
            cursor: default;
            box-shadow: none;
            font-weight: normal;
            font-size: 0.85rem;
            padding: 8px 14px;
        }

        .node-arrow {
            color: #cbd5e1;
            font-size: 0.85rem;
            line-height: 1;
        }

        /* 6度終點標題：配合主調，置於白方格正下方外側 */
        .game-outer-label-bottom {
            text-align: center;
            color: grey;
            font-size: 0.6rem;
            font-weight: bold;
            margin-top: 3px;
            margin-bottom: 0px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ==========================================
           【懸浮功能按鈕群】精準固定在白色大卡片右下角內側
           ========================================== */
        .floating-actions {
            position: absolute;
            right: 10px;
            bottom: 40%; /* 避開下方藍色角色選擇面板的頂部位置 */
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        /* 圓形按鈕優化排版，確保「查看答案」不超出 */
        .circle-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #113160; 
            border: none;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: all 0.2s ease;
            font-size: 0.68rem; 
            font-weight: bold;
            padding: 2px;
            text-align: center;
            line-height: 1.2;
            box-sizing: border-box;
        }

        .circle-btn:hover {
            transform: scale(1.06);
            background-color: #1a427a;
        }

        .circle-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            margin-bottom: 2px;
        }

        /* 提示文字盒 */
        .game-hint-box {
            background: #fff8e1;
            border-left: 4px solid var(--warning-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #5d4037;
            margin-bottom: 10px;
            display: none;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* ==========================================
           【下方角色選擇區】
           ========================================== */
        .selection-panel {
            background-color: #5582be; 
            margin: 0 -20px -15px -20px; 
            padding: 12px 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            z-index: 5;
            border-radius: 0px 0px 40px 40px;
        }

        .selection-title {
            color: white;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .options-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .options-scroll-area::-webkit-scrollbar {
            width: 5px;
        }
        .options-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-option {
            background: white;
            border: 1px solid #b0bec5;
            color: #2196f3; 
            padding: 8px 4px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            word-break: break-all;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 42px;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            background: #e3f2fd;
            transform: translateY(-1px);
        }

        .btn-option .sub-remark {
            font-size: 0.65rem;
            color: #78909c;
            font-weight: normal;
            margin-top: 2px;
        }

        .empty-notice {
            grid-column: 1 / -1;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* ==========================================
           【彈窗與答案揭曉樣式】
           ========================================== */
        .success-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }

        .success-card {
            background: white;
            padding: 25px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            color: var(--text-dark);
        }

        .success-scroll-area {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .success-title {
            color: var(--success-color);
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .btn-action {
            padding: 12px 20px;
            font-size: 0.95rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 6px 0;
            border: none;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.2s;
        }

        .btn-action:hover { transform: translateY(-1px); }
        .btn-restart { background: var(--primary-purple); color: white; }
        .btn-share { background: #5582be; color: white; }
        .btn-show-others { background: #9fa8da; color: white; }

        .answer-block {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: #f5f7fa;
            border: 1px solid #e4e7eb;
            border-radius: 12px;
            text-align: left;
        }

        .answer-path-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            font-size: 0.8rem;
        }

        .answer-node {
            background: #e0e4f5;
            color: #3f51b5;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .loading-view {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        @media (max-width: 360px) {
            .options-grid { grid-template-columns: repeat(2, 1fr); }
            .node-box { width: 140px; padding: 6px; font-size: 0.85rem; }
            .cover-title { font-size: 2.2rem; }
            .floating-actions { 
                bottom: auto;       /* 1. 先解除原本卡在卡片上方的底部定位 */
                top: 78%;          /* 2. 改用 top（從頂部往下算）來強行壓低按鈕位置 */
                right: 10px;        /* 3. 微調貼近右側邊緣，防止它移位 */
    }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="loadingView" class="loading-view">🪐 載入大千世界檔案中...</div>

    <div id="coverView" class="cover-container" style="display: none;">
        <div class="cover-header">
            失眠藥廣播劇<br>之
        </div>
        <div class="cover-main">
            <div class="cover-title">六度圈與Game</div>
            <div class="cover-subtitle">連接劇中人物之間的鎖鏈<br>找出最短的社交路徑</div>
        </div>
        <div>
            <button class="btn-start-game" onclick="switchToGameView()">
                <span>進入遊戲</span>
                <span class="arrow">➔</span>
            </button>
        </div>
    </div>

    <div id="gameView" class="game-container">
        
        <div class="game-main-card">
            <div class="floating-actions">
                <button class="circle-btn" onclick="triggerGameHint()" title="獲取提示">
                    <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
                    <div>提示</div>
                </button>
                <button class="circle-btn" onclick="showAnswersView()" title="查看答案">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
                    <div>查看</div><div>答案</div>
                </button>
            </div>

            <div id="hintDisplayBox" class="game-hint-box"></div>

            <div class="vertical-path-container" id="verticalPathContainer">
                </div>

            <div class="selection-panel">
                <div class="selection-title" id="selectionTitle">請選擇下一位連結角色：</div>
                <div class="options-scroll-area">
                    <div class="options-grid" id="optionsGrid">
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="success-overlay" id="successOverlay">
    <div class="success-card">
        <div class="success-title" id="overlayTitle">🎉 連結成功！</div>
        <div class="success-scroll-area">
            <p id="successDetails" style="line-height: 1.5; margin-bottom: 15px; font-size: 0.9rem; color: #4b5563; text-align: left;"></p>
            
            <div id="otherAnswersContainer" style="display: none;"></div>
            
            <button id="btnShowOthers" class="btn-action btn-show-others" style="display: none;" onclick="displayAlternativeAnswers()">🔍 顯示其他最佳答案</button>
            <button id="btnShareResult" class="btn-action btn-share" onclick="copyResultToClipboard()">複製鏈結分享</button>
            <button class="btn-action btn-restart" onclick="restartNewGame()">再玩一次</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // Google Sheets API 資訊
    // ==========================================
    const SPREADSHEET_ID = '1srN4k7xMuGOZFz1JgsuFRfFvRQeXcBCiAcAjPnk1_JI'; 
    const API_KEY = 'AIzaSyASvYZevWiECOAXp8ab9S4Xd1V97Kpw714';

    let characterList = []; 
    let remarksMap = {};    
    let matrixData = {};    
    
    let gameState = {
        startChar: '',
        endChar: '',
        currentPath: [], 
        maxSteps: 6      // 最多 5 個中間人
    };

    async function loadDataFromSheets() {
        try {
            const remarksUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/Character remarks?key=${API_KEY}`;
            const remarksRes = await fetch(remarksUrl);
            const remarksJson = await remarksRes.json();
            
            if(remarksJson.values) {
                remarksJson.values.forEach((row, index) => {
                    if (index === 0) return; 
                    if (row[0]) {
                        remarksMap[row[0].trim()] = row[1] ? row[1].trim() : '';
                    }
                });
            }

            const matrixUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/matrix?key=${API_KEY}`;
            const matrixRes = await fetch(matrixUrl);
            const matrixJson = await matrixRes.json();

            if (!matrixJson.values || matrixJson.values.length === 0) throw new Error("無法讀取矩陣資料");

            const rows = matrixJson.values;
            const headerRow = rows[0]; 
            
            characterList = headerRow.slice(1).map(name => name.trim());
            characterList.forEach(char => { matrixData[char] = []; });

            for (let colIndex = 1; colIndex < headerRow.length; colIndex++) {
                const columnChar = headerRow[colIndex].trim();
                for (let rowIndex = 1; rowIndex < rows.length; rowIndex++) {
                    const rowCells = rows[rowIndex];
                    const rowChar = rowCells[0] ? rowCells[0].trim() : null;
                    const cellValue = rowCells[colIndex];

                    if (rowChar && cellValue && cellValue.toLowerCase() === 'v') {
                        if (matrixData[columnChar]) {
                            matrixData[columnChar].push(rowChar);
                        }
                    }
                }
            }

            characterList.forEach(char => {
                if(remarksMap[char] === undefined) {
                    remarksMap[char] = "";
                }
            });

            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('coverView').style.display = 'flex';

            initGameData();

        } catch (error) {
            console.error(error);
            document.getElementById('loadingView').innerHTML = `<div style="color:#ef4444; padding:20px;">資料連線失敗<br><small>${error.message}</small></div>`;
        }
    }

    function switchToGameView() {
        document.getElementById('coverView').style.display = 'none';
        document.getElementById('gameView').style.display = 'flex';
    }

    function restartNewGame() {
        document.getElementById('successOverlay').style.display = 'none';
        initGameData();
    }

    function initGameData() {
        document.getElementById('otherAnswersContainer').style.display = 'none';
        document.getElementById('otherAnswersContainer').innerHTML = '';
        document.getElementById('btnShowOthers').style.display = 'none';
        document.getElementById('hintDisplayBox').style.display = 'none';

        if (characterList.length < 2) return;

        let rand1, rand2;
        let validQuestionFound = false;
        let attempts = 0;
        let validPaths = [];

        while (!validQuestionFound && attempts < 500) {
            attempts++;
            rand1 = Math.floor(Math.random() * characterList.length);
            rand2 = Math.floor(Math.random() * characterList.length);
            
            while (rand1 === rand2) {
                rand2 = Math.floor(Math.random() * characterList.length);
            }

            let tempStart = characterList[rand1];
            let tempEnd = characterList[rand2];
            
            const startNeighbors = matrixData[tempStart] || [];
            if (startNeighbors.includes(tempEnd)) continue; 
            
            validPaths = findAllShortestPaths(tempStart, tempEnd);
            
            if (validPaths.length > 0 && validPaths[0].length - 1 > 1 && (validPaths[0].length - 1) <= gameState.maxSteps) {
                validQuestionFound = true;
                gameState.startChar = tempStart;
                gameState.endChar = tempEnd;
            }
        }

        if (!validQuestionFound) {
            gameState.startChar = characterList[rand1];
            gameState.endChar = characterList[rand2];
        }

        gameState.currentPath = [gameState.startChar]; 
        renderGameEngine();
    }

    function findAllShortestPaths(start, end) {
        if (!matrixData[start] || !matrixData[end]) return [];
        let queue = [[start]];
        let shortestPaths = [];
        let minLength = Infinity;
        let visitedLengths = {}; 
        visitedLengths[start] = 1;

        while (queue.length > 0) {
            let currentPath = queue.shift();
            let lastNode = currentPath[currentPath.length - 1];

            if ((currentPath.length - 1) > gameState.maxSteps) break;
            if (currentPath.length > minLength) break;

            if (lastNode === end) {
                if (currentPath.length < minLength) {
                    minLength = currentPath.length;
                    shortestPaths = [currentPath];
                } else if (currentPath.length === minLength) {
                    shortestPaths.push(currentPath);
                }
                continue;
            }

            let neighbors = matrixData[lastNode] || [];
            for (let neighbor of neighbors) {
                if (!visitedLengths[neighbor] || currentPath.length + 1 <= visitedLengths[neighbor]) {
                    visitedLengths[neighbor] = currentPath.length + 1;
                    queue.push([...currentPath, neighbor]);
                }
            }
        }
        return shortestPaths;
    }

    function renderGameEngine() {
        const currentCharacter = gameState.currentPath[gameState.currentPath.length - 1];
        const connectionsCount = gameState.currentPath.length - 1;

        if (currentCharacter === gameState.endChar) {
            showSuccessPopup();
            return;
        }

        // --- 動態渲染中央關係鏈 (起點方格 + 5個中間人方格 + 終點方格) ---
        const pathContainer = document.getElementById('verticalPathContainer');
        let pathHtml = '';

        // 1. 渲染頂部「0度起點」方格（加入縮小版備註）
        const startRemark = remarksMap[gameState.startChar] ? `<span class="sub-remark" style="color: #e0e4f5; font-size: 0.6rem; margin-top: 2px; font-weight: normal;">${remarksMap[gameState.startChar]}</span>` : '';
        pathHtml += `
            <div id="startLabelOuter" class="game-outer-label-top">0度起點</div>
            <div class="node-box start-node" onclick="handleRollback(0)" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <span>${gameState.startChar}</span>
                ${startRemark}
            </div>
            <div class="node-arrow">↓</div>
        `;

        // 2. 渲染中間 5 個連結角色方格
        for (let i = 1; i <= 5; i++) {
            if (gameState.currentPath[i] && gameState.currentPath[i] !== gameState.endChar) {
                // 已填入的中間人（加入縮小版備註）
                const midChar = gameState.currentPath[i];
                const midRemark = remarksMap[midChar] ? `<span class="sub-remark" style="color: #e0e4f5; font-size: 0.6rem; margin-top: 2px; font-weight: normal;">${remarksMap[midChar]}</span>` : '';
                pathHtml += `
                    <div class="node-box" onclick="handleRollback(${i})" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <span>${midChar}</span>
                        ${midRemark}
                    </div>
                `;
            } else {
                // 空白方格
                pathHtml += `
                    <div class="node-box empty">&nbsp;</div>
                `;
            }
            pathHtml += `<div class="node-arrow">↓</div>`;
        }

        // 3. 渲染底部「6度終點」方格（加入縮小版備註）
        const endRemark = remarksMap[gameState.endChar] ? `<span class="sub-remark" style="color: #ffcdd2; font-size: 0.6rem; margin-top: 2px; font-weight: normal;">${remarksMap[gameState.endChar]}</span>` : '';
        pathHtml += `
            <div class="node-box end-node" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <span>${gameState.endChar}</span>
                ${endRemark}
            </div>
            <div id="endLabelOuter" class="game-outer-label-bottom">6度終點</div>
        `;

        pathContainer.innerHTML = pathHtml;

        // --- 下方角色選擇區更新 ---
        const titleEl = document.getElementById('selectionTitle');
        const gridEl = document.getElementById('optionsGrid');
        
        titleEl.innerText = `請選擇「${currentCharacter}」認識的角色`;

        // 獲取目前角色認識的所有人
        const acquaintances = matrixData[currentCharacter] || [];

        // 【修改核心邏輯】
        // 當 connectionsCount 達到 maxSteps - 1 (即 5 個中間人填滿時)
        if (connectionsCount >= gameState.maxSteps - 1) {
            // 檢查這個第5中間人的熟人名單裡，有沒有包含終點
            if (acquaintances.includes(gameState.endChar)) {
                // 正確的情況：不做攔截跳出，直接讓它流向下方的正常渲染，顯示全部認識的角色
            } else {
                // 錯誤的情況：顯示失敗警告
                gridEl.innerHTML = `
                    <div class="empty-notice">
                        ⚠️ 已達到中間人數量上限！未能成功連接終點。<br>
                        請點擊上方已選方格退回重選，<br>
                        或點擊右側功能鈕查看答案。
                    </div>`;
                return;
            }
        }

        // 正常渲染邏輯（包含滿 5 個中間人且正確時，會走這裡列出所有人）
        if (acquaintances.length === 0) {
            gridEl.innerHTML = `<div class="empty-notice">此角色在當前宇宙中無向下延展的關係，請點選上方鎖鏈回溯。</div>`;
        } else {
            let gridHtml = '';
            acquaintances.forEach(name => {
                const remarkText = remarksMap[name] ? `<span class="sub-remark">${remarksMap[name]}</span>` : '';
                // 如果該名單中有終點角色，我們幫它單獨加個醒目的邊框（可選，如不想要特殊邊框可以移除 style）
                const specialStyle = (name === gameState.endChar) ? : '';
                const prefix = (name === gameState.endChar) ? ' ' : '';
                
                gridHtml += `
                    <button class="btn-option" ${specialStyle} onclick="handleSelectCharacter('${name}')">
                        <span>${prefix}${name}</span>
                        ${remarkText}
                    </button>
                `;
            });
            gridEl.innerHTML = gridHtml;
        }
    }

    function handleSelectCharacter(name) {
        gameState.currentPath.push(name);
        renderGameEngine();
    }

    function handleRollback(index) {
        if (index === 0 && gameState.currentPath.length === 1) return;
        if (index >= gameState.currentPath.length) return;
        gameState.currentPath = gameState.currentPath.slice(0, index + 1);
        document.getElementById('hintDisplayBox').style.display = 'none';
        renderGameEngine();
    }

    function triggerGameHint() {
        const hintBox = document.getElementById('hintDisplayBox');
        const currentCharacter = gameState.currentPath[gameState.currentPath.length - 1];
        const remainingSteps = gameState.maxSteps - (gameState.currentPath.length - 1);

        if (currentCharacter === gameState.endChar) {
            hintBox.innerHTML = `🎉 您已經抵達終點！`;
            hintBox.style.display = 'block';
            return;
        }

        let paths = findAllShortestPaths(currentCharacter, gameState.endChar);
        if (paths.length === 0 || (paths[0].length - 1) > remainingSteps) {
            hintBox.innerHTML = `⚠️ <strong>提示：</strong> 當前路徑在剩餘步數內無解，建議點選上方鎖鏈返回重選。`;
            hintBox.style.display = 'block';
            return;
        }

        let randomPath = paths[Math.floor(Math.random() * paths.length)];
        let nextCharHint = randomPath[1]; 
        hintBox.innerHTML = `💡 <strong>過關提示：</strong> 推薦下一個連接：【 <strong>${nextCharHint}</strong> 】`;
        hintBox.style.display = 'block';
    }

    function showAnswersView() {
        const paths = findAllShortestPaths(gameState.startChar, gameState.endChar);
        const container = document.getElementById('otherAnswersContainer');
        const titleEl = document.getElementById('overlayTitle');
        const detailsEl = document.getElementById('successDetails');
        const btnShowOthers = document.getElementById('btnShowOthers');
        const btnShareResult = document.getElementById('btnShareResult'); // 取得分享按鈕

        titleEl.innerText = "🔮 正確答案揭曉";
        btnShowOthers.style.display = 'none';
        if (btnShareResult) btnShareResult.style.display = 'none'; // 隱藏複製鏈結分享按鈕
        container.style.display = 'block';

        if (paths.length === 0) {
            detailsEl.innerHTML = `從「${gameState.startChar}」到「${gameState.endChar}」在 6 度限制內無通路。`;
            container.innerHTML = '';
        } else {
            const steps = paths[0].length - 2;
            detailsEl.innerHTML = `最少僅需 <strong>${steps}</strong> 個中間人，共找到 ${paths.length} 組最佳解：`;
            
            let html = '';
            paths.forEach((path, idx) => {
                html += `
                    <div class="answer-block">
                        <div style="font-size:0.75rem; color:var(--primary-purple); font-weight:bold; margin-bottom:5px;">解法 #${idx+1}</div>
                        <div class="answer-path-row">
                `;
                path.forEach((char, cIdx) => {
                    html += `<span class="answer-node">${char}</span>`;
                    if (cIdx < path.length - 1) html += `<span>➔</span>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }
        document.getElementById('successOverlay').style.display = 'flex';
    }

    function showSuccessPopup() {
        const steps = gameState.currentPath.length - 2; 
        const titleEl = document.getElementById('overlayTitle');
        const detailsEl = document.getElementById('successDetails');
        const btnShowOthers = document.getElementById('btnShowOthers');
        const btnShareResult = document.getElementById('btnShareResult'); // 取得分享按鈕
        
        titleEl.innerText = "🎉 連結成功！";
        detailsEl.innerHTML = `恭喜！你成功用 <strong>${steps}</strong> 個中間角色，將「<strong>${gameState.startChar}</strong>」與「<strong>${gameState.endChar}</strong>」連結在一起！`;
        
        document.getElementById('otherAnswersContainer').style.display = 'none';
        if (btnShareResult) btnShareResult.style.display = 'block'; // 玩家正常通關，顯示分享按鈕
        
        const allPaths = findAllShortestPaths(gameState.startChar, gameState.endChar);
        if (allPaths.length > 1) {
            btnShowOthers.style.display = 'block';
        } else {
            btnShowOthers.style.display = 'none';
        }

        document.getElementById('successOverlay').style.display = 'flex';
    }

    function displayAlternativeAnswers() {
        const container = document.getElementById('otherAnswersContainer');
        const allPaths = findAllShortestPaths(gameState.startChar, gameState.endChar);
        
        let html = `<div style="border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px; text-align:left;">
                    <span style="font-size:0.8rem; font-weight:bold; color:#7986cb;">💡 本題其餘最佳解法：</span>`;
        
        allPaths.forEach((path, idx) => {
            html += `
                <div class="answer-block">
                    <div style="font-size:0.7rem; color:var(--warning-color); font-weight:bold; margin-bottom:4px;">組合 #${idx+1}</div>
                    <div class="answer-path-row">
            `;
            path.forEach((char, cIdx) => {
                html += `<span class="answer-node" style="background:#f0f0f0; color:#555;">${char}</span>`;
                if (cIdx < path.length - 1) html += `<span>➔</span>`;
            });
            html += `</div></div>`;
        });
        html += `</div>`;
        
        container.innerHTML = html;
        container.style.display = 'block';
        document.getElementById('btnShowOthers').style.display = 'none';
    }

    function copyResultToClipboard() {
        const steps = gameState.currentPath.length - 2;
        const pathString = gameState.currentPath.join(' ➔ ');
        const shareText = `🪐 失眠藥廣播劇之六度圈與Game 🌙\n\n起點：${gameState.startChar}\n終點：${gameState.endChar}\n🧩 成功使用了 ${steps} 個中間角色過關！\n\n⛓️ 關係鎖鏈：\n${pathString}\n\n快來挑戰你對失眠藥宇宙的角色熟悉度吧！`;
        
        navigator.clipboard.writeText(shareText).then(() => {
            alert('複製成功！快去分享給其他鎮民吧！');
        }).catch(() => {
            alert('複製失敗，可以直接截圖分享喔！');
        });
    }

    window.onload = loadDataFromSheets;
</script>
